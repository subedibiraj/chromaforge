# ──────────────────────────────────────────────────────────────────────────────
# ChromaForge — CNN baseline configuration
# Simple encoder-decoder CNN (no skip connections), L1 loss only
# ──────────────────────────────────────────────────────────────────────────────

experiment:
  name: "chromaforge-cnn-baseline"
  description: "Simple encoder-decoder CNN baseline with L1 loss only"

data:
  data_dir: "data/train2017"
  img_size: 256
  val_fraction: 0.1
  subset_size: 20000

training:
  batch_size: 16
  num_workers: 4
  epochs: 20
  seed: 42

optimizer:
  lr: 2.0e-4
  beta1: 0.9
  beta2: 0.999

loss:
  lambda_l1: 1.0

scheduler:
  decay_epoch: 10

checkpointing:
  save_every: 5
  sample_every: 5
  n_val_samples: 8

output:
  output_dir: "training/runs_cnn_baseline"
